<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Quản lý & Thêm Bài báo - Admin</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css" />
  <link rel="stylesheet" href="../../assets/css/style.css" />
</head>
<body id="page-admin-articles" class="bg-light">
  <nav class="navbar navbar-expand-lg navbar-dark bg-dark sticky-top shadow-sm" id="site-header">
    <div class="container" id="header-inner">
      <a href="Dashboard.html" id="brand-logo" class="navbar-brand font-weight-bold">GENK MAGAZINE ADMIN</a>
      <button class="navbar-toggler" type="button" data-toggle="collapse" data-target="#adminNavbar">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="adminNavbar">
        <ul class="navbar-nav ml-auto" id="admin-nav">
          <li class="nav-item active"><a class="nav-link font-weight-bold" href="Article.html" id="link-admin-articles">Quản lí Bài báo</a></li>
          <li class="nav-item"><a class="nav-link" href="SourceNews.html" id="link-admin-sources">Quản lí Nguồn tin</a></li>
          <li class="nav-item"><a class="nav-link" href="ManageUser.html" id="link-admin-users">Quản lí Tài khoản</a></li>
          <li class="nav-item"><a class="nav-link" href="History.html" id="link-admin-history">Lịch sử hoạt động</a></li>
          <li class="nav-item"><a class="nav-link btn btn-outline-light btn-sm text-light ml-lg-2 px-3" href="../index.html">Về trang chủ</a></li>
        </ul>
      </div>
    </div>
  </nav>

  <main class="container my-4" id="main-content">
    <div class="row">
      <div class="col-lg-12">
        <div class="card shadow-sm mb-4 border-0">
          <div class="card-header bg-primary text-white">
            <h4 class="mb-0 font-weight-bold">Thêm / Chỉnh sửa bài báo</h4>
          </div>
          <div class="card-body">
            <form id="form-admin-article" class="admin-article-form">
              <input type="hidden" id="admin-article-id" name="article_id" />

              <div class="form-group">
                <label for="admin-article-title" class="font-weight-bold">Tiêu đề bài báo <span class="text-danger">*</span></label>
                <input type="text" class="form-control" id="admin-article-title" name="title" placeholder="Nhập tiêu đề bài viết..." required />
              </div>

              <div class="form-row">
                <div class="form-group col-md-6">
                  <label for="admin-article-category" class="font-weight-bold">Danh mục <span class="text-danger">*</span></label>
                  <select id="admin-article-category" name="category" class="form-control custom-select" required></select>
                </div>
                <div class="form-group col-md-6">
                  <label for="admin-article-source" class="font-weight-bold">Nguồn báo</label>
                  <select id="admin-article-source" name="source" class="form-control custom-select"></select>
                </div>
              </div>

              <div class="form-group">
                <label for="admin-article-summary" class="font-weight-bold">Mô tả ngắn / Tóm tắt</label>
                <textarea id="admin-article-summary" name="summary" class="form-control" rows="2" placeholder="Tóm tắt ngắn gọn nội dung bài viết..."></textarea>
              </div>

              <div class="form-row">
                <div class="form-group col-md-6">
                  <label for="admin-article-cover-file" class="font-weight-bold">Tải ảnh bìa</label>
                  <input type="file" id="admin-article-cover-file" class="form-control-file" accept="image/jpeg,image/png,image/webp" />
                  <small class="form-text text-muted">JPEG, PNG hoặc WebP.</small>
                </div>
                <div class="form-group col-md-6">
                  <label for="admin-article-cover-url" class="font-weight-bold">Hoặc dán URL ảnh bìa</label>
                  <input type="url" id="admin-article-cover-url" class="form-control" placeholder="https://..." />
                </div>
              </div>

              <div class="form-row">
                <div class="form-group col-md-6">
                  <label for="admin-article-image-urls" class="font-weight-bold">URL ảnh trong bài</label>
                  <textarea id="admin-article-image-urls" class="form-control" rows="3" placeholder="Mỗi đường dẫn ảnh trên một dòng"></textarea>
                </div>
                <div class="form-group col-md-6">
                  <label for="admin-article-video-urls" class="font-weight-bold">URL video trong bài</label>
                  <textarea id="admin-article-video-urls" class="form-control" rows="3" placeholder="Mỗi đường dẫn video MP4/WebM trên một dòng"></textarea>
                  <input type="file" id="admin-article-video-file" class="form-control-file mt-2" accept="video/mp4,video/webm,video/ogg" />
                </div>
              </div>

              <div class="form-group">
                <label for="admin-article-content" class="font-weight-bold">Nội dung bài báo <span class="text-danger">*</span></label>
                <textarea id="admin-article-content" name="content" class="form-control" rows="8" placeholder="Dán hoặc nhập nội dung chi tiết bài báo ở đây..." required></textarea>
              </div>

              <div class="form-group form-check">
                <input type="checkbox" class="form-check-input" id="admin-article-visible" checked />
                <label class="form-check-label font-weight-bold text-success" for="admin-article-visible">
                  Xuất bản ngay
                </label>
              </div>

              <div class="mt-4">
                <button type="submit" id="btn-save-article" class="btn btn-primary px-4 py-2 font-weight-bold">Lưu bài báo</button>
                <button type="button" id="btn-reset-article" class="btn btn-secondary px-4 py-2 ml-2">Làm mới form</button>
              </div>
            </form>
          </div>
        </div>

        <div class="card shadow-sm border-0">
          <div class="card-header bg-white border-bottom">
            <h5 class="mb-0 font-weight-bold text-dark">Danh sách bài báo hiện có</h5>
          </div>
          <div class="card-body">
            <div id="admin-articles-list" class="admin-articles-list" aria-live="polite"></div>
          </div>
        </div>
      </div>
    </div>
  </main>

  <script src="../../assets/js/api.js"></script>
  <script src="../../assets/js/admin_articles.js"></script>
</body>
</html>
