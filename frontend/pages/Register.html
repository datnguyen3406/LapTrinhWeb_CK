<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Đăng ký tài khoản</title>
  <link rel="stylesheet" href="../assets/css/style.css" />
</head>
<body id="page-register">
  <header id="site-header" class="site-header">
    <div id="header-inner" class="header-inner">
      <a href="index.html" id="brand-logo" class="brand-logo">GENK MAGAZINE</a>
     
    </div>
  </header>

  <main id="main-content" class="main-content">
    <section id="register-section" class="register-section">
      <h1 id="register-title">Đăng ký tài khoản</h1>

      <form id="form-register" class="register-form">
        <div class="form-group">
          <label for="register-username">Tên đăng nhập</label>
          <input type="text" id="register-username" name="username" autocomplete="username" minlength="3" maxlength="32" pattern="[A-Za-z0-9_.\-]+" required />
        </div>
        <div class="form-group">
          <label for="register-name">Tên hiển thị</label>
          <input type="text" id="register-name" name="display_name" autocomplete="name" maxlength="100" required />
        </div>

        <div class="form-group">
          <label for="register-password">Mật khẩu</label>
          <input type="password" id="register-password" name="password" autocomplete="new-password" minlength="8" required />
        </div>

        <div class="form-group">
          <label for="register-confirm-password">Nhập lại mật khẩu</label>
          <input type="password" id="register-confirm-password" name="confirm_password" autocomplete="new-password" minlength="8" required />
        </div>

        <button type="submit" id="btn-submit-register">Tạo tài khoản Reader</button>
      </form>

      <div id="register-message" class="register-message form-message" role="alert" hidden></div>

      <p class="auth-switch">
        Đã có tài khoản? <a href="Auth.html" id="link-go-login">Đăng nhập ngay</a>
      </p>
    </section>
  </main>

  <script src="../assets/js/api.js"></script>
  <script src="../assets/js/register.js"></script>
</body>
</html>
