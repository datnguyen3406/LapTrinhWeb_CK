<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Đăng ký tài khoản - Genk Magazine</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css" />
  <link rel="stylesheet" href="../assets/css/style.css" />
</head>
<body id="page-register" class="bg-light">
  <nav class="navbar navbar-dark bg-dark py-3 shadow-sm" id="site-header">
    <div class="container justify-content-center" id="header-inner">
      <a href="index.html" id="brand-logo" class="navbar-brand font-weight-bold">GENK MAGAZINE</a>
    </div>
  </nav>

  <main class="container my-5" id="main-content">
    <div class="row justify-content-center">
      <div class="col-md-6 col-lg-5">
        <div class="card shadow-sm border-0" id="register-section">
          <div class="card-body p-4">
            <h3 id="register-title" class="card-title font-weight-bold text-center mb-4">Đăng ký tài khoản Reader</h3>

            <form id="form-register" class="register-form">
              <div class="form-group">
                <label for="register-username" class="font-weight-bold">Tên đăng nhập <span class="text-danger">*</span></label>
                <input type="text" class="form-control" id="register-username" name="username" autocomplete="username" minlength="3" maxlength="32" pattern="[A-Za-z0-9_.\-]+" placeholder="Từ 3-32 ký tự, không dấu..." required />
              </div>

              <div class="form-group">
                <label for="register-name" class="font-weight-bold">Tên hiển thị <span class="text-danger">*</span></label>
                <input type="text" class="form-control" id="register-name" name="display_name" autocomplete="name" maxlength="100" placeholder="Tên của bạn..." required />
              </div>

              <div class="form-group">
                <label for="register-password" class="font-weight-bold">Mật khẩu <span class="text-danger">*</span></label>
                <input type="password" class="form-control" id="register-password" name="password" autocomplete="new-password" minlength="8" placeholder="Tối thiểu 8 ký tự..." required />
              </div>

              <div class="form-group">
                <label for="register-confirm-password" class="font-weight-bold">Nhập lại mật khẩu <span class="text-danger">*</span></label>
                <input type="password" class="form-control" id="register-confirm-password" name="confirm_password" autocomplete="new-password" minlength="8" placeholder="Xác nhận lại mật khẩu..." required />
              </div>

              <button type="submit" id="btn-submit-register" class="btn btn-primary btn-block font-weight-bold py-2 mt-4">Tạo tài khoản</button>
            </form>

            <div id="register-message" class="register-message form-message mt-3" role="alert" hidden></div>

            <hr class="my-4" />
            <p class="auth-switch text-center mb-0 small">
              Đã có tài khoản? <a href="Auth.html" id="link-go-login" class="font-weight-bold text-primary">Đăng nhập ngay</a>
            </p>
          </div>
        </div>
      </div>
    </div>
  </main>

  <script src="../assets/js/api.js"></script>
  <script src="../assets/js/register.js"></script>
</body>
</html>
