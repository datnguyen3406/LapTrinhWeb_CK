<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Chi tiết bài báo - Genk Magazine</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css" />
  <link rel="stylesheet" href="../assets/css/style.css" />
</head>
<body id="page-article-detail">
  <header id="site-header" class="site-header">
    <div id="header-inner" class="header-inner">
      <a href="index.html" id="brand-logo" class="brand-logo">GENK MAGAZINE</a>
    
      <form id="header-search-form" class="header-search-form" role="search">
        <input
          type="search"
          id="header-search-input"
          class="header-search-input"
          name="q"
          placeholder="Tìm kiếm bài báo..."
          aria-label="Tìm kiếm bài báo"
        />
        <button type="submit" id="btn-header-search" class="btn-header-search">Tìm</button>
      </form>
      <nav id="category-nav" class="category-nav" aria-label="Danh mục bài báo">
        <ul id="nav-categories" class="nav-categories">
          <li class="nav-category-item">
            <button type="button" id="cat-mobile" data-category="mobile">MOBILE</button>
          </li>
          <li class="nav-category-item">
            <button type="button" id="cat-ai" data-category="ai">AI</button>
          </li>
          <li class="nav-category-item">
            <button type="button" id="cat-internet" data-category="internet">INTERNET</button>
          </li>
          <li class="nav-category-item">
            <button type="button" id="cat-tin-ict" data-category="tin-ict">TIN ICT</button>
          </li>
          <li class="nav-category-item">
            <button type="button" id="cat-kham-pha" data-category="kham-pha">KHÁM PHÁ</button>
          </li>
        </ul>
      </nav>
      <nav id="account-nav" class="account-nav" aria-label="Tài khoản">
        <a href="Auth.html">Đăng nhập</a>
        <a href="Register.html">Đăng ký</a>
      </nav>
    </div>
  </header>

  <main id="main-content" class="main-content">
    <p id="article-state" class="page-state" role="status" hidden></p>
    <article id="article-detail-container" class="article-detail-container" data-article-id="" hidden>
      <span id="article-category" class="article-category-badge"></span>
      <h1 id="article-title" class="article-title"></h1>

      <div id="article-meta" class="article-meta">
        <span id="article-source" class="article-source"></span>
        <time id="article-date" class="article-date"></time>
      </div>

      <div id="article-thumbnail" class="article-thumbnail-frame"></div>
      <p id="article-summary" class="article-summary"></p>
      <div id="article-content" class="article-content"></div>

      <div id="article-actions" class="article-actions">
        <button type="button" id="btn-toggle-favorite">Thêm vào yêu thích</button>
      </div>
    </article>
  </main>

  <script src="../assets/js/api.js"></script>
  <script src="../assets/js/article_content.js"></script>
  <script src="../assets/js/article_detail.js"></script>
</body>
</html>
