<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Đổi mật khẩu</title>
  <link rel="stylesheet" href="../../CSS/style.css" />
</head>
<body>
  <header>
    <a href="../index.html">Trang chủ</a>
    <a href="Reader.html">Không gian đọc</a>
    <a href="Favourite.html">Yêu thích</a>
    <a href="Profie.html">Hồ sơ</a>
    <button type="button" id="btn-logout">Đăng xuất</button>
  </header>

  <main>
    <h1>Đổi mật khẩu</h1>

    <form id="form-change-password" class="form-box">
      <div class="form-group">
        <label for="old-password">Mật khẩu hiện tại</label>
        <input type="password" id="old-password" autocomplete="current-password" required />
      </div>

      <div class="form-group">
        <label for="new-password">Mật khẩu mới</label>
        <input type="password" id="new-password" autocomplete="new-password" required minlength="8" />
      </div>

      <div class="form-group">
        <label for="confirm-password">Xác nhận mật khẩu mới</label>
        <input type="password" id="confirm-password" autocomplete="new-password" required minlength="8" />
      </div>

      <button type="submit" id="btn-change-password">Xác nhận đổi mật khẩu</button>
      <a href="Profie.html" class="btn-back">← Quay lại hồ sơ</a>
    </form>
  </main>

  <p id="change-password-message" class="form-message" role="status" hidden></p>

  <script src="../../JavaScript/api.js"></script>
  <script src="../../JavaScript/change-password.js"></script>
</body>
</html>
