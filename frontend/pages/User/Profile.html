<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Hồ sơ cá nhân</title>
  <link rel="stylesheet" href="../../assets/css/style.css" />
</head>
<body>
  <header>
    <a href="../index.html">Trang chủ</a>
    <a href="Reader.html">Không gian đọc</a>
    <a href="Favourite.html">Yêu thích</a>
    <a href="Profile.html" class="active">Hồ sơ</a>
    <button type="button" id="btn-logout">Đăng xuất</button>
  </header>

  <main>
    <h1>Hồ sơ cá nhân</h1>

    <div class="profile-layout">
      <section id="profile-info">
        <div class="avatar-box">
          <img id="avatar-preview" src="../../assets/images/default-avatar.svg" alt="Avatar" width="140" height="140" />
        </div>

        <form id="form-profile">
          <div class="form-group">
            <label for="profile-name">Tên hiển thị</label>
            <input type="text" id="profile-name" required />
          </div>

          <div class="form-group">
            <label for="profile-username">Tên đăng nhập</label>
            <input type="text" id="profile-username" disabled />
          </div>

          <div class="form-group">
            <label for="profile-avatar-file">Đổi ảnh đại diện</label>
            <input type="file" id="profile-avatar-file" accept="image/*" />
          </div>

          <button type="submit" id="btn-save-profile">Lưu thay đổi</button>
        </form>
        <p id="profile-message" class="form-message" role="status" hidden></p>
      </section>

      <aside class="profile-links">
        <h3>Cài đặt khác</h3>
        <ul>
          <li><a href="ChangePassword.html">Đổi mật khẩu</a></li>
          <li><a href="Appearance.html">Cỡ chữ & Giao diện</a></li>
        </ul>
      </aside>
    </div>
  </main>

  <script src="../../assets/js/api.js"></script>
  <script src="../../assets/js/profile.js"></script>
</body>
</html>
