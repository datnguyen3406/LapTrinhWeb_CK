<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Thư mục yêu thích</title>
  <link rel="stylesheet" href="../../assets/css/style.css" />
</head>
<body id="page-user-favorites">
  <header id="site-header" class="site-header">
    <div id="header-inner" class="header-inner">
      <a href="../index.html" id="brand-logo" class="brand-logo">GENK MAGAZINE</a>
    
      <form id="header-search-form" class="header-search-form" role="search">
        <input
          type="search"
          id="header-search-input"
          class="header-search-input"
          name="q"
          placeholder="Tìm kiếm bài báo..."
          aria-label="Tìm kiếm bài báo"
        />
        <button type="submit" id="btn-header-search" class="btn-header-search">Tìm</button>
      </form>
      <nav id="category-nav" class="category-nav" aria-label="Danh mục bài báo">
        <ul id="nav-categories" class="nav-categories">
          <li class="nav-category-item">
            <button type="button" id="cat-mobile" data-category="mobile">MOBILE</button>
          </li>
          <li class="nav-category-item">
            <button type="button" id="cat-ai" data-category="ai">AI</button>
          </li>
          <li class="nav-category-item">
            <button type="button" id="cat-internet" data-category="internet">INTERNET</button>
          </li>
          <li class="nav-category-item">
            <button type="button" id="cat-tin-ict" data-category="tin-ict">TIN ICT</button>
          </li>
          <li class="nav-category-item">
            <button type="button" id="cat-kham-pha" data-category="kham-pha">KHÁM PHÁ</button>
          </li>
        </ul>
      </nav>
      <nav id="account-nav" class="account-nav" aria-label="Tài khoản">
        <a href="../Auth.html">Đăng nhập</a>
        <a href="../Register.html">Đăng ký</a>
      </nav>
    </div>
  </header>

  <main id="main-content" class="main-content">
    <section id="favorites-header-section" class="favorites-header-section">
      <h1 id="favorites-title">Thư mục yêu thích &amp; Phân loại bài báo</h1>

      <form id="form-create-folder" class="create-folder-form">
        <label for="folder-name-input">Tên thư mục mới</label>
        <input type="text" id="folder-name-input" name="folder_name" required />
        <button type="submit" id="btn-create-folder">Tạo thư mục</button>
      </form>
    </section>

    <section id="folders-section" class="folders-section">
      <h2>Danh sách thư mục</h2>
      <div id="folders-list" class="folders-list"></div>
    </section>

    <section id="folder-articles-section" class="folder-articles-section">
      <h2 id="selected-folder-title">Bài báo trong thư mục</h2>
      <div id="folder-articles-list" class="folder-articles-list"></div>
    </section>
  </main>

  <script src="../../assets/js/api.js"></script>
  <script src="../../assets/js/favorites.js"></script>
</body>
</html>
