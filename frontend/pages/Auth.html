<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Đăng Nhập</title>
  <link rel="stylesheet" href="../CSS/style.css" />
</head>
<body>
  <header>
    <a href="index.html" id="link-back-home">Genk</a>
  </header>

  <main>
    <section id="login-section">
      <h1>Đăng nhập</h1>
      <form id="form-login">
        <label for="login-email">Email</label>
        <input type="email" id="login-email" name="email" autocomplete="username" required />

        <label for="login-password">Mật khẩu</label>
        <input type="password" id="login-password" name="password" autocomplete="current-password" required />

        <button type="submit" id="btn-submit-login">Đăng nhập</button>
        <a href="Regisger.html" id="btn-register">Đăng ký</a>
        <a href="ForgetPassword.html" id="btn-forget-password">Quên mật khẩu</a>
      </form>
      <p id="login-message" class="form-message" role="alert" hidden></p>
    </section>
    <hr />
  </main>

  <script src="../JavaScript/api.js"></script>
  <script src="../JavaScript/auth.js"></script>
</body>
</html>
