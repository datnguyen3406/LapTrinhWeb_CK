<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Khôi phục mật khẩu - Genk Magazine</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css" />
  <link rel="stylesheet" href="../assets/css/style.css" />
</head>
<body id="page-recover-by-code" class="bg-light">
  <nav class="navbar navbar-dark bg-dark py-3 shadow-sm" id="site-header">
    <div class="container justify-content-center" id="header-inner">
      <a href="index.html" id="brand-logo" class="navbar-brand font-weight-bold text-center">GENK MAGAZINE</a>
    </div>
  </nav>

  <main class="container my-5" id="main-content">
    <div class="row justify-content-center">
      <div class="col-md-6 col-lg-5">
        <div class="card shadow-sm border-0">
          <div class="card-body p-4">
            <h3 id="recover-code-title" class="card-title font-weight-bold text-center mb-3">Khôi phục mật khẩu</h3>
            <p class="text-muted small text-center mb-4">Nhập tên đăng nhập và mã khôi phục đã lưu khi tạo tài khoản.</p>

            <form id="form-recover-code" class="recover-code-form">
              <div class="form-group" id="recovery-username-group">
                <label for="recovery-username" class="font-weight-bold">Tên đăng nhập</label>
                <input type="text" class="form-control" id="recovery-username" autocomplete="username" placeholder="Tên đăng nhập đã đăng ký..." required />
              </div>

              <div class="form-group" id="recovery-code-group" hidden>
                <label for="recovery-code" class="font-weight-bold">Mã khôi phục</label>
                <input type="text" class="form-control font-weight-bold text-primary" id="recovery-code" autocomplete="one-time-code" placeholder="Mã khôi phục..." required />
              </div>

              <div class="form-group" id="recovery-password-group" hidden>
                <label for="recovery-new-password" class="font-weight-bold">Mật khẩu mới</label>
                <input type="password" class="form-control mb-3" id="recovery-new-password" autocomplete="new-password" minlength="8" placeholder="Nhập mật khẩu mới (tối thiểu 8 ký tự)..." />
                <label for="recovery-confirm-password" class="font-weight-bold">Nhập lại mật khẩu mới</label>
                <input type="password" class="form-control" id="recovery-confirm-password" autocomplete="new-password" minlength="8" placeholder="Xác nhận lại mật khẩu..." />
              </div>

              <button type="submit" id="btn-verify-code" class="btn btn-primary btn-block font-weight-bold py-2 mt-3">Đặt lại mật khẩu</button>
            </form>

            <div id="recover-code-message" class="recover-code-message form-message mt-3" role="alert" hidden></div>

            <hr class="my-4" />
            <div class="text-center">
              <a href="Auth.html" id="link-back-login" class="font-weight-bold text-primary">Quay lại đăng nhập</a>
            </div>
          </div>
        </div>
      </div>
    </div>
  </main>

  <script src="../assets/js/api.js"></script>
  <script src="../assets/js/recover_code.js"></script>
</body>
</html>
