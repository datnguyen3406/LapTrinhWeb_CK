<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Khôi phục mật khẩu bằng mã</title>
  <link rel="stylesheet" href="../CSS/style.css" />
</head>
<body id="page-recover-by-code">
  <header id="site-header" class="site-header">
    <div id="header-inner" class="header-inner">
      <a href="index.html" id="brand-logo" class="brand-logo">GENK MAGAZINE</a>
    </div>
  </header>

  <main id="main-content" class="main-content">
    <section id="recover-code-section" class="recover-code-section">
      <h1 id="recover-code-title">Khôi phục mật khẩu</h1>

      <form id="form-recover-code" class="recover-code-form">
        <div class="form-group" id="recovery-email-group">
          <label for="recovery-email">Email đăng ký</label>
          <input type="email" id="recovery-email" name="email" autocomplete="email" />
        </div>
        <input type="hidden" id="recovery-token" />
        <div class="form-group" id="recovery-password-group" hidden>
          <label for="recovery-new-password">Mật khẩu mới</label>
          <input type="password" id="recovery-new-password" autocomplete="new-password" minlength="8" />
          <label for="recovery-confirm-password">Nhập lại mật khẩu mới</label>
          <input type="password" id="recovery-confirm-password" autocomplete="new-password" minlength="8" />
        </div>
        <button type="submit" id="btn-verify-code">Gửi liên kết đặt lại</button>
      </form>

      <div id="recover-code-message" class="recover-code-message form-message" role="alert" hidden></div>

      <p class="auth-switch">
        <a href="Auth.html" id="link-back-login">Quay lại đăng nhập</a>
      </p>
    </section>
  </main>

  <script src="../JavaScript/api.js"></script>
  <script src="../JavaScript/recover_code.js"></script>
</body>
</html>
