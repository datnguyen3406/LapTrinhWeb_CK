<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Đăng ký tài khoản</title>
  <link rel="stylesheet" href="../CSS/style.css" />
</head>
<body id="page-register">
  <header id="site-header" class="site-header">
    <div id="header-inner" class="header-inner">
      <a href="index.html" id="brand-logo" class="brand-logo">GENK MAGAZINE</a>
     
    </div>
  </header>

  <main id="main-content" class="main-content">
    <section id="register-section" class="register-section">
      <h1 id="register-title">Đăng ký tài khoản</h1>

      <form id="form-register" class="register-form">
        <div class="form-group">
          <label for="register-name">Họ và tên</label>
          <input type="text" id="register-name" name="name" required />
        </div>

        <div class="form-group">
          <label for="register-password">Mật khẩu</label>
          <input type="password" id="register-password" name="password" required />
        </div>

        <div class="form-group">
          <label for="register-confirm-password">Nhập lại mật khẩu</label>
          <input type="password" id="register-confirm-password" name="confirm_password" required />
        </div>

        <button type="submit" id="btn-submit-register">Đăng ký</button>
      </form>

      <div id="register-message" class="register-message" role="alert"></div>

      <p class="auth-switch">
        Đã có tài khoản-<a href="Auth.html" id="link-go-login">Đăng nhập ngay</a>
      </p>
    </section>
  </main>

  <script src="../JS/register.js"></script>
</body>
</html>
