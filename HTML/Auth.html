<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Đăng Nhập</title>
  <link rel="stylesheet" href="../CSS/style.css" />
</head>
<body>
  <header>
    <a href="index.html" id="link-back-home">Genk</a>
  </header>

  <main>
    <section id="login-section">
      <h1>Đăng nhập</h1>
      <form id="form-login">
        <label for="login-email">Tên đăng nhập</label>
        <input type="text" id="login-email" required />

        <label for="login-password">Mật khẩu</label>
        <input type="password" id="login-password" required />

        <button type="submit" id="btn-submit-login">Đăng nhập</button>
        <button type="button" id="btn-register">Đăng ký</button>
        <button href="ForgetPassword.html" type="button" id="btn-forget-password">Quên mật khẩu</button>
      </form>
      <p id="login-message"></p>
    </section>
    <hr />
  </main>

  <script src="../JS/auth.js"></script>
</body>
</html>
