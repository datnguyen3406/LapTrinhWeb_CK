<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#d71a21" />
  <title>GENK MAGAZINE</title>
  <link rel="stylesheet" href="../CSS/style.css" />
  <link rel="manifest" href="../manifest.webmanifest" />
</head>
<body id="page-index">
  <header id="site-header" class="site-header">
    <div id="header-inner" class="header-inner">
      <a href="index.html" id="brand-logo" class="brand-logo">GENK MAGAZINE</a>
    
      <!-- Thanh tìm kiếm bài báo -->
      <form id="header-search-form" class="header-search-form" role="search">
        <input
          type="search"
          id="header-search-input"
          class="header-search-input"
          name="q"
          placeholder="Tìm kiếm bài báo..."
          aria-label="Tìm kiếm bài báo"
        />
        <button type="submit" id="btn-header-search" class="btn-header-search">Tìm</button>
      </form>
      <!-- Thanh danh mục bài báo -->
      <nav id="category-nav" class="category-nav" aria-label="Danh mục bài báo">
        <ul id="nav-categories" class="nav-categories">
          <li class="nav-category-item">
            <button type="button" id="cat-mobile" data-category="mobile">MOBILE</button>
          </li>
          <li class="nav-category-item">
            <button type="button" id="cat-ai" data-category="ai">AI</button>
          </li>
          <li class="nav-category-item">
            <button type="button" id="cat-internet" data-category="internet">INTERNET</button>
          </li>
          <li class="nav-category-item">
            <button type="button" id="cat-tin-ict" data-category="tin-ict">TIN ICT</button>
          </li>
          <li class="nav-category-item">
            <button type="button" id="cat-kham-pha" data-category="kham-pha">KHÁM PHÁ</button>
          </li>
        </ul>
      </nav>
      <label class="source-filter-label" for="source-filter">Nguồn</label>
      <select id="source-filter" aria-label="Lọc theo nguồn báo">
        <option value="">Tất cả nguồn</option>
      </select>
      <nav id="account-nav" class="account-nav" aria-label="Tài khoản">
        <a href="Auth.html">Đăng nhập</a>
        <a href="Regisger.html">Đăng ký</a>
      </nav>
    </div>
  </header>

  <!-- Nội dung chính (dữ liệu bài báo đổ từ database) -->
  <main id="main-content" class="main-content">
    <!-- Khung bài nổi bật lớn (đổ 1 bài từ DB) -->
    <section id="featured-section" class="featured-section" aria-label="Bài viết nổi bật">
      <div id="featured-article-slot" class="featured-article-slot" data-source="db-featured-article"></div>
    </section>

    <!-- Khung lưới 3 cột các bài viết tiếp theo (đổ danh sách từ DB) -->
    <section id="articles-section" class="articles-section" aria-label="Danh sách bài viết">
      <div id="articles-grid-slot" class="articles-grid-slot" data-source="db-articles-list"></div>
    </section>
  </main>

  <script src="../JavaScript/api.js"></script>
  <script src="../JavaScript/index.js"></script>
</body>
</html>
