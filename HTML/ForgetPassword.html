<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Khôi phục mật khẩu bằng mã</title>
  <link rel="stylesheet" href="../CSS/style.css" />
</head>
<body id="page-recover-by-code">
  <header id="site-header" class="site-header">
    <div id="header-inner" class="header-inner">
      <a href="index.html" id="brand-logo" class="brand-logo">GENK MAGAZINE</a>
    </div>
  </header>

  <main id="main-content" class="main-content">
    <section id="recover-code-section" class="recover-code-section">
      <h1 id="recover-code-title">Khôi phục mật khẩu</h1>

      <form id="form-recover-code" class="recover-code-form">
        <div class="form-group">
          <label for="recovery-code-input">Mã khôi phục</label>
          <input type="text" id="recovery-code-input" name="recovery_code" required />
        </div>

        <button type="submit" id="btn-verify-code">Xác nhận</button>
      </form>

      <div id="recovered-password-box" class="recovered-password-box">
        <span id="recovered-password-label">Mật khẩu của bạn:</span>
        <strong id="recovered-password-value"></strong>
      </div>

      <div id="recover-code-message" class="recover-code-message" role="alert"></div>

      <p class="auth-switch">
        <a href="Auth.html" id="link-back-login">Quay lại đăng nhập</a>
      </p>
    </section>
  </main>

  <script src="../JavaScript/recover_code.js"></script>
</body>
</html>
